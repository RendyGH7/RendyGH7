name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake (custom theme)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: RendyGH7
          outputs: |
            dist/snake-rendy-dark.svg?palette=github-dark&color_snake=%2336BCF7
            dist/snake-rendy-light.svg?color_snake=%232C5364&color_dots=%23ebedf0,%23a5d6ff,%2364a1f4,%233c7dd9,%232C5364

      - name: Push to output branch (replaces old files)
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
